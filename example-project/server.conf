# HTTP (80): ACME challenge + redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN_NAME} ${DOMAIN_ALIASES};

    # ← ACME CHALLENGE: Highest priority, serves Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
        try_files $uri =404;
    }

    # Optional: Health check (doesn't interfere)
    location = /healthz {
        return 200 'healthy';
    }

    # Everything else → redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (443): TLS + reverse proxy to Django
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    http2 on; 

    server_name ${DOMAIN_NAME} ${DOMAIN_ALIASES};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_NAME}/privkey.pem;

    # Reject requests whose Host header doesn't match the SNI hostname this
    # connection's TLS handshake actually negotiated. Without this, a client
    # could complete the handshake against THIS project's certificate (valid
    # SNI) but send a Host header naming a different project hosted on this
    # same nginx — landing its HTTP request in that other project's server
    # block (its proxy_pass, webhook include, static root) despite having
    # encrypted the connection with a completely different domain's key.
    # 421 is the HTTP/2-spec-correct response here (RFC 7540 §9.1.2): a
    # compliant client transparently retries on a fresh connection, so this
    # is safe even for legitimate DOMAIN_ALIASES traffic that got coalesced
    # onto one HTTP/2 connection.
    if ($host != $ssl_server_name) {
        return 421;
    }

    # Static files
    location /static/ {
        alias /srv/shared-files/${DOMAIN_NAME}/static/;
        # expires 30d;
    }

    # Media files
    location /media/ {
        alias /srv/shared-files/${DOMAIN_NAME}/media/;
        # access_log off;
        expires 1h;
    }


    # Webhook location snippet (if present)
    include /etc/nginx/webhooks.d/${DOMAIN_NAME}-*.conf;



    # Proxy to Django app
    location / {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://${DOCKER_NETWORK_SERVICE_ALIAS}:${APP_PORT};
    }
}