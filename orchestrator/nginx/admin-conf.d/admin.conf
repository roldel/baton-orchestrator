 server {
  listen 80 default_server;
  server_name _;

  # Let’s Encrypt HTTP-01 challenge
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme-challenge;
    try_files $uri =404;
  }

  # Optional: basic health page
  location = /health { return 200; }
}

# Catch-all for TLS connections whose SNI/Host doesn't match any project's
# server block in conf.d/. Without this, nginx falls back to serving one of
# the per-project blocks (effectively whichever conf.d file loads first) for
# unmatched requests, handing out that tenant's cert/site to the wrong host.
# ssl_reject_handshake refuses the TLS handshake outright, so no certificate
# is needed here.
server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  server_name _;
  ssl_reject_handshake on;
}
